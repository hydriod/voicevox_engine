[build-system]
requires = ["setuptools>=73,<74", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "coeiroink-engine"
version = "0.2.1+coeiroink.1.7.3"
description = "COEIROINK Engine HTTP server"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
    "appdirs",
    "coeirocore-rs",
    "fastapi",
    "jinja2",
    "numpy",
    "pydantic",
    "pyopenjtalk @ git+https://github.com/VOICEVOX/pyopenjtalk@f4ade29ef9a4f43d8605103cb5bacc29e0b2ccae",
    "pyworld",
    "pyyaml",
    "requests",
    "scipy",
    "soundfile",
    "starlette",
    "typing-extensions",
    "uvicorn",
]

[tool.setuptools]
license-files = ["LICENSE", "licenses/GPL-3.0.txt", "licenses/SOURCES.md"]

[tool.setuptools.packages.find]
include = ["voicevox_engine*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.uv.sources]
coeirocore-rs = { path = "../coeirocore-rs", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
